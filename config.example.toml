# Module purpose: developer-only maintenance switches, including the admin config editor and controlled web maintenance console.
# 模块作用：developer 专用维护开关，包括管理页配置编辑器和受控 Web 维护操作台。
[developer]
# Allows users with the developer role to edit this TOML file from the admin UI.
# 允许 developer 角色用户在管理界面编辑此 TOML 配置文件。
config_editor_enabled = true

# Enables the web developer console allowlist. Keep false unless this backend is protected by trusted network/auth controls.
# 开启 Web 开发者操作台白名单。除非后端受可信网络/认证控制保护，否则建议保持 false。
# The console does not expose arbitrary shell execution; it only enables explicit maintenance actions.
# 操作台不暴露任意 shell 执行，只开放明确实现的维护操作。
console_enabled = false
